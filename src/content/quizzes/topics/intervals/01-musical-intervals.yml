    es: ¿Cuál es la 3ª menor de A?
  subPrompt:
    en: Calculate the note 3 semitones (1 step and a half) above A.
    es: Calcula la nota a 3 semitonos (1 tono y medio) por encima de A.
  options:
    - id: opt-a-min3-c
      label:
        en: C
        es: C
    - id: opt-a-min3-b
      label:
