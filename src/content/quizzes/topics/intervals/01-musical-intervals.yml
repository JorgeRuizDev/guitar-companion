- id: q-interval-c-p5-letters
  familyIds:
    - family-interval-c-p5
  type: single-choice
  course: 2
  difficulty: beginner
  topics:
    - intervals
    - theory
  notation: letters
  prompt:
    en: What is the Perfect 5th of C?
    es: ¿Cuál es la 5ª Justa de C?
  subPrompt:
    en: Calculate the note 7 semitones above C.
    es: Calcula la nota 7 semitonos por encima de C.
  options:
    - id: opt-c-p5-g
      label:
        en: G
        es: G
    - id: opt-c-p5-f
      label:
        en: F
        es: F
    - id: opt-c-p5-d
      label:
        en: D
        es: D
    - id: opt-c-p5-a
      label:
        en: A
        es: A
  correctAnswer:
    - opt-c-p5-g
  remediation:
    explanation:
      en: The Perfect 5th of C is G (7 semitones / 3 and a half steps).
      es: La 5ª Justa de C es G (7 semitonos / 3 tonos y medio).
    hint:
      en: Count 7 frets up from C or think of the open G string.
      es: Cuenta 7 trastes desde C o piensa en la cuerda Sol al aire.
    mnemonic:
      en: C to G is the cornerstone interval of guitar power chords (C5).
      es: De C a G es la base de los acordes de quinta (C5) en la guitarra.

