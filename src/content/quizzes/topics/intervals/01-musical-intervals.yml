      es: La 3ª menor de A es C (3 semitonos / 1 tono y medio).
    hint:
      en: A minor third is 3 frets up; from A to B is 2 semitones, B to C is 1 semitone.
      es: Una tercera menor son 3 semitonos; de A a B hay 2 semitonos y de B a C hay 1 semitono.
    mnemonic:
      en: A-C-E forms the classic open A minor chord (Am).
      es: A-C-E forma el acorde abierto de La menor (Am); C le da su carácter melancólico.

