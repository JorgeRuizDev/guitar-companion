      es: De C a G hay una 5ª Justa (7 semitonos / 3 tonos y medio).
    hint:
      en: C (1) - D (2) - E (3) - F (4) - G (5) spans 5 scale degrees and 7 semitones.
      es: C (1) - D (2) - E (3) - F (4) - G (5) abarca 5 grados y 7 semitonos.
    mnemonic:
      en: C-G is the fundamental fifth interval.
      es: C-G es el intervalo de quinta fundamental.

