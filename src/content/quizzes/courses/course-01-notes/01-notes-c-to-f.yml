- id: c01-q-c-to-solfege
  familyIds:
    - family-c-translation
  type: single-choice
  course: 1
  difficulty: beginner
  topics:
    - notes
    - translation
  notation: letters
  prompt:
    en: What is the Solfège name for the note 'C'?
    es: ¿Cuál es el nombre en Solfeo de la nota 'C'?
  subPrompt:
    en: Select the corresponding syllable.
    es: Selecciona la sílaba correspondiente.
  options:
    - id: opt-do
      label:
        en: Do
        es: Do
    - id: opt-re
      label:
        en: Re
        es: Re
    - id: opt-mi
      label:
        en: Mi
        es: Mi
    - id: opt-la
      label:
        en: La
        es: La
  correctAnswer:
    - opt-do
  remediation:
    explanation:
      en: "'C' corresponds to 'Do' in the Solfège system."
      es: "'C' corresponde a 'Do' en el sistema de Solfeo."
    hint:
      en: "Series: C=Do, D=Re, E=Mi, F=Fa, G=Sol, A=La, B=Si."
      es: "Serie: C=Do, D=Re, E=Mi, F=Fa, G=Sol, A=La, B=Si."
    mnemonic:
      en: C = Do
      es: C = Do
