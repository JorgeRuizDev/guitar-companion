- id: c01-q-g-to-solfege
  familyIds:
    - family-g-translation
  type: single-choice
  course: 1
  difficulty: beginner
  topics:
    - notes
    - translation
  notation: letters
  prompt:
    en: What is the Solfège name for the note 'G'?
    es: ¿Cuál es el nombre en Solfeo de la nota 'G'?
  subPrompt:
    en: Select the corresponding syllable.
    es: Selecciona la sílaba correspondiente.
  options:
    - id: opt-sol
      label:
        en: Sol
        es: Sol
    - id: opt-fa
      label:
        en: Fa
        es: Fa
    - id: opt-la
      label:
        en: La
        es: La
    - id: opt-do
      label:
        en: Do
        es: Do
  correctAnswer:
    - opt-sol
  remediation:
    explanation:
      en: "'G' corresponds to 'Sol' in the Solfège system."
      es: "'G' corresponde a 'Sol' en el sistema de Solfeo."
    hint:
      en: "Series: C=Do, D=Re, E=Mi, F=Fa, G=Sol, A=La, B=Si."
      es: "Serie: C=Do, D=Re, E=Mi, F=Fa, G=Sol, A=La, B=Si."
    mnemonic:
      en: G = Sol
      es: G = Sol
