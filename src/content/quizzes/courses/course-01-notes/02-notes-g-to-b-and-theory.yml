- id: c01-q-natural-half-steps
  familyIds:
    - family-natural-half-steps
  type: multiple-choice
  course: 1
  difficulty: intermediate
  topics:
    - theory
    - notes
  notation: dual
  prompt:
    en: Which pairs of natural notes are separated by only a half step (semitone)?
    es: ¿Cuáles pares de notas naturales están separados por solo un semitono?
  subPrompt:
    en: Select all correct pairs (all-or-nothing evaluation).
    es: Selecciona todos los pares correctos (evaluación todo o nada).
  options:
    - id: opt-b-c
      label:
        en: B - C
        es: Si - Do
    - id: opt-e-f
      label:
        en: E - F
        es: Mi - Fa
    - id: opt-c-d
      label:
        en: C - D
        es: Do - Re
    - id: opt-g-a
      label:
        en: G - A
        es: Sol - La
  correctAnswer:
    - opt-b-c
    - opt-e-f
  remediation:
    explanation:
      en: In the natural diatonic scale, only B-C and E-F have no accidental between
        them; they are separated by a natural half step (semitone). All other
        adjacent natural notes have a whole step between them.
      es: En la escala diatónica natural, únicamente Si-Do (B-C) y Mi-Fa (E-F) no
        tienen alteración intermedia; están separados por un semitono natural.
        Todas las demás notas naturales adyacentes están a un tono completo de
        distancia.
    mnemonic:
      en: "Remember: B-C and E-F have no sharps/flats in between!"
      es: "Recuerda: Si y Mi dan el paso corto (semitono) a la siguiente (Do y Fa)."
- id: c01-q-guitar-standard-strings
  familyIds:
    - family-guitar-open-strings
  type: multiple-choice
  course: 1
  difficulty: beginner
  topics:
    - notes
    - theory
  notation: letters
  prompt:
    en: Which of these notes belong to standard guitar tuning (E-A-D-G-B-E)?
    es: ¿Cuáles de estas notas pertenecen a la afinación estándar de guitarra
      (E-A-D-G-B-E)?
  options:
    - id: opt-e
      label:
        en: E
        es: E
    - id: opt-a
      label:
        en: A
        es: A
    - id: opt-f-sharp
      label:
        en: F#
        es: F#
    - id: opt-c-sharp
      label:
        en: C#
        es: C#
  correctAnswer:
    - opt-e
    - opt-a
  remediation:
    explanation:
      en: Standard guitar tuning from 6th to 1st string is E - A - D - G - B - E. Both
        E and A are open string notes.
      es: La afinación estándar de la 6ª a la 1ª cuerda es E - A - D - G - B - E.
        Tanto E como A son cuerdas al aire.
    mnemonic:
      en: Eddie Ate Dynamite, Good Bye Eddie
      es: E - A - D - G - B - E (Mi - La - Re - Sol - Si - Mi)
